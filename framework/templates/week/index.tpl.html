<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="This week begins with a deceptively simple question: what does it mean to pay attention? We will look at perception not as passive reception, but as an active relation between ourselves and the world.">
  <title>{{titel}} • Commonplace</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/site.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../../index.html">Commonplace<span>.</span></a>
    <div class="header-tools"><button class="theme-toggle" type="button" data-theme-toggle>Dark mode</button></div>
  </div>
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../../index.html">Home</a> <span class="separator" aria-hidden="true">/</span> 
    <span aria-current="page">Week {{weeknummer}}</span></nav>
</header>
<main>
  <section class="page-intro">
    <div class="intro-copy">
      <p class="eyebrow">WEEK {{weeknummer}}</p>
      <h1>{{titel}}</h1>
      <p class="lead">{{content}}</p>
    </div>
    <img class="intro-image" src="../../assets/images/week-one.svg" alt="" fetchpriority="high">
  </section>
  
<section aria-labelledby="section-title">
  <div class="section-heading"><h2 id="section-title">This week's activities</h2><small>3 items</small></div>
  <div class="tile-list">
{{index_tiles}}
  </div>
</section>
  
</main>
<footer class="page-footer"><div class="footer-inner">Commonplace • Course material</div></footer>
</body>
</html>
